name: FT Buffer - Actualizar ETFs

on:
  schedule:
    # Todos los lunes a las 9:00 AM CST (UTC-6)
    # En UTC: 15:00 = 9:00 AM CST
    - cron: '0 15 * * 1'
  
  # Tambien permite ejecucion manual para pruebas
  workflow_dispatch:

jobs:
  actualizar-etfs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas openpyxl lxml
    
    - name: Ejecutar script
      run: |
        python "FT buffer remaining cap code"
    
    - name: Subir Excel como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: FT-Buffer-Excel
        path: FT_buffer_remaining_cap.xlsx
        retention-days: 7
    
    - name: Enviar email con Excel adjunto
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Actualización semanal - FT Buffer Remaining Cap"
        to: Alejandro.jimenez@evolveam.com.mx
        from: ${{ secrets.EMAIL_USER }}
        html_body: |
          <html>
          <head>
            <style>
              body { font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; color: #333; }
              .container { max-width: 600px; margin: 0 auto; padding: 20px; }
              .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 10px 10px 0 0; }
              .content { background: #f9f9f9; padding: 30px; border-radius: 0 0 10px 10px; }
              .highlight { background: #e8f4f8; padding: 15px; border-left: 4px solid #667eea; margin: 20px 0; }
              .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }
              h1 { margin: 0; font-size: 24px; }
              h2 { color: #667eea; margin-top: 0; }
              .date { font-size: 14px; opacity: 0.9; margin-top: 10px; }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="header">
                <h1>FT Buffer - Actualización Semanal</h1>
                <div class="date">${{ github.event.repository.updated_at }}</div>
              </div>
              
              <div class="content">
                <p>Estimado equipo,</p>
                
                <p>Les comparto la actualización semanal del <strong>FT Buffer Remaining Cap</strong> correspondiente a esta semana.</p>
                
                <div class="highlight">
                  <h3>📊 Resumen de la actualización:</h3>
                  <ul>
                    <li>✅ Datos actualizados de los ETFs F y G</li>
                    <li>📈 Remaining Buffer y Cap calculados</li>
                    <li>📊 Fund Value/Return y Reference Asset Value incluidos</li>
                    <li>📉 Downside Before Buffer actualizado</li>
                  </ul>
                </div>
                
                <p>El archivo Excel adjunto contiene:</p>
                <ul>
                  <li><strong>Hoja "Datos ETFs"</strong> - Información completa de todos los ETFs</li>
                  <li><strong>Hoja "Resumen F"</strong> - ETFs tipo F (FJAN a FDEC)</li>
                  <li><strong>Hoja "Resumen G"</strong> - ETFs tipo G (GJAN a GDEC)</li>
                </ul>
                
                <p>Los datos fueron extraídos directamente de la página oficial de First Trust Portfolios y procesados automáticamente.</p>
                
                <p>Si tienen alguna pregunta o necesitan análisis adicional, no duden en contactarme.</p>
                
                <p>Saludos cordiales,<br>
                <strong>Sistema Automatizado FT Buffer</strong></p>
                
                <div class="footer">
                  <p>Este es un correo automático generado por el sistema de FT Buffer.<br>
                  Repositorio: <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a></p>
                </div>
              </div>
            </div>
          </body>
          </html>
        convert_markdown: false
        attachments: FT_buffer_remaining_cap.xlsx
