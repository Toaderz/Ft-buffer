name: FT Buffer - Actualizar ETFs

on:
  schedule:
    # Todos los lunes a las 9:00 AM CST (UTC-6)
    # En UTC: 15:00 = 9:00 AM CST
    - cron: '0 15 * * 1'
  
  # Tambien permite ejecucion manual para pruebas
  workflow_dispatch:

jobs:
  actualizar-etfs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas openpyxl lxml
    
    - name: Ejecutar script
      run: |
        python "FT buffer remaining cap code"
    
    - name: Subir Excel como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: FT-Buffer-Excel
        path: FT_buffer_remaining_cap.xlsx
        retention-days: 7
    
    - name: Enviar email con Excel adjunto
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "FT Buffer Actualizado - ${{ github.event.repository.updated_at }}"
        to: Alejandro.jimenez@evolveam.com.mx
        from: ${{ secrets.EMAIL_USER }}
        html_body: |
          <html>
          <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
            <h2 style="color: #2c5282;">Hola Alejandro,</h2>
            
            <p>Te mando los FT buffers actualizados.</p>
            
            <p>El archivo Excel esta adjunto con los datos de esta semana.</p>
            
            <p>Saludos.</p>
          </body>
          </html>
        convert_markdown: false
        attachments: FT_buffer_remaining_cap.xlsx
