name: FT Buffer - Actualizar ETFs

on:
  schedule:
    # Todos los lunes a las 9:00 AM CST (UTC-6)
    # En UTC: 15:00 = 9:00 AM CST
    - cron: '0 15 * * 1'
  
  # También permite ejecución manual para pruebas
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Email de prueba (opcional)'
        required: false
        default: 'ana.pacheco@evolveam.com.mx'

jobs:
  actualizar-etfs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Instalar dependencias comunes si no hay requirements.txt
        pip install pandas requests openpyxl xlrd
    
    - name: Ejecutar script de FT Buffer
      id: ejecutar
      run: |
        # Aquí ejecutamos tu script principal
        # Ajusta el nombre del archivo según tu repo
        python main.py 2>&1 | tee output.log
        echo "status=$?" >> $GITHUB_OUTPUT
      continue-on-error: true
    
    - name: Preparar resultado
      id: resultado
      run: |
        # Extraer las últimas 50 líneas del output para el email
        tail -n 50 output.log > email_content.txt
        
        # Contar ETFs procesados (ajusta según tu output)
        ETF_COUNT=$(grep -c "ETF" output.log || echo "0")
        echo "etf_count=$ETF_COUNT" >> $GITHUB_OUTPUT
        
        # Verificar si hubo errores
        if grep -q "ERROR\|error\|Error" output.log; then
          echo "has_errors=true" >> $GITHUB_OUTPUT
        else
          echo "has_errors=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Enviar email de confirmación
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "FT Buffer Actualizado - ${{ github.run_id }}"
        to: ${{ github.event.inputs.test_email || 'ana.pacheco@evolveam.com.mx' }}
        from: ${{ secrets.EMAIL_USER }}
        html_body: |
          <html>
          <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
            <h2 style="color: #2c5282;">FT Buffer - Actualización de ETFs</h2>
            
            <p><strong>Fecha:</strong> ${{ github.event.repository.updated_at || github.event.head_commit.timestamp || 'Hoy' }}</p>
            <p><strong>Estado:</strong> 
              ${{ steps.resultado.outputs.has_errors == 'true' && '<span style="color: #c62828;">⚠️ Completado con errores</span>' || '<span style="color: #2e7d32;">✅ Completado exitosamente</span>' }}
            </p>
            
            <div style="background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 20px 0;">
              <h3 style="margin-top: 0;">Resumen de la ejecución:</h3>
              <pre style="background: white; padding: 10px; border-radius: 3px; overflow-x: auto;">${{ steps.resultado.outputs.etf_count || 'N/A' }} ETFs procesados</pre>
            </div>
            
            <div style="background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 20px 0;">
              <h3 style="margin-top: 0;">Output del script:</h3>
              <pre style="background: white; padding: 10px; border-radius: 3px; overflow-x: auto; max-height: 400px; overflow-y: auto;">${{ steps.resultado.outputs.has_errors == 'true' && '<span style="color: #c62828;">Ver detalles del error en los logs</span>' || 'Script ejecutado correctamente' }}</pre>
            </div>
            
            <p style="margin-top: 30px; font-size: 12px; color: #666;">
              Este es un mensaje automático del sistema FT Buffer.<br>
              Repositorio: <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a><br>
              Workflow Run: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Ver detalles</a>
            </p>
          </body>
          </html>
        
        convert_markdown: false
    
    - name: Subir logs como artefacto
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ft-buffer-logs-${{ github.run_id }}
        path: |
          output.log
          email_content.txt
        retention-days: 7
